language: shona
iso_code: sna
hf_dataset_name: google/WaxalNLP
hf_dataset_config: sna_asr
train_split: train
val_split: validation
test_split: test
min_duration_sec: 1.5
max_words_per_sec: 4.0
audio_column: audio
text_column: transcription
cache_dir: /data/hf_cache/jgibson2/waxal/cache
num_proc: 8
fleurs_config: sn_zw
speaker_holdout_validation: true # replace WAXAL's official (speaker-leaky:
  # 66-89% overlap with train, verified empirically) validation split with a
  # speaker-disjoint holdout carved from train, so early stopping reflects
  # genuine speaker generalization rather than voice memorization.
speaker_holdout_fraction: 0.15
