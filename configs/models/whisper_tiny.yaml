family: whisper
checkpoint: openai/whisper-tiny
effective_batch_size: 32
per_device_batch_size: 8 # ASSUMPTION: 8 x accumulation 4 fits the stated 40 GB GPU.
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_schedule: polynomial_decay
warmup_steps: 500
max_epochs: 30
early_stopping_patience: 3
seed: 42
decoding_strategy: greedy
# Hyperparameter-tuning override block: leave disabled for baseline reproduction.
tuning_overrides: {enabled: false, learning_rate: null, max_epochs: null}
