family: whisper
checkpoint: openai/whisper-small
effective_batch_size: 32
per_device_batch_size: 4 # 8 OOMed on a T4 under DataParallel; accumulation rises to keep 32.
max_train_duration_sec: 30 # Whisper sees only 30 s; longer clips carry transcript text with no
  # audio behind it and teach the decoder to keep generating (Acholi: 15% of clips,
  # 354% test WER on them before this filter). Standard Whisper fine-tuning recipe.
# gradient_accumulation_steps is derived in src/train.py so that
# per_device_batch_size x n_gpu x accumulation == effective_batch_size.
learning_rate: 1.0e-4
lr_schedule: polynomial_decay
warmup_steps: 500
eval_steps: 500 # eval/save cadence; the paper's Table 5 step counts are all multiples of 500.
dataloader_num_workers: 4
max_epochs: 30
early_stopping_patience: 3
seed: 42
decoding_strategy: greedy
tuning_overrides: {enabled: false, learning_rate: null, max_epochs: null}
