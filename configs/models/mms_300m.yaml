family: mms_300m
checkpoint: facebook/mms-300m
freeze_encoder: true # ASSUMPTION: freeze all pretrained wav2vec2 backbone layers.
effective_batch_size: 32
per_device_batch_size: 8 # ASSUMPTION: 8 x accumulation 4; adjust in YAML if required.
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
lr_schedule: polynomial_decay
warmup_steps: 500
max_epochs: 30
early_stopping_patience: 3
seed: 42
decoding_strategy: greedy
tuning_overrides: {enabled: false, learning_rate: null, max_epochs: null}
